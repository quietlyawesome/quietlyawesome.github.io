<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Passkey PRF test</title>
<style>
:root{color-scheme:dark}
body{margin:0;background:#0E1116;color:#E8EAEE;font:16px/1.5 -apple-system,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:40px 20px 60px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:28px;letter-spacing:-.02em}
h2{margin:0 0 10px;font-size:13px;font-weight:600;color:#9AA3AF;text-transform:uppercase;letter-spacing:.08em}
.sub{margin:0;color:#9AA3AF}
.card{background:#161B22;border:1px solid #2A313B;border-radius:16px;padding:16px}
button{width:100%;height:52px;border:0;border-radius:26px;background:#8FA4FF;color:#0E1116;font:600 16px -apple-system,system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.5}
.fp{margin-top:14px;font:600 24px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;text-align:center}
.fp.bad{color:#F2B84B}
.hint{margin:8px 0 0;font-size:13px;color:#9AA3AF;text-align:center}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:#C9CED6}
</style>
</head>
<body>
<main>
<h1>Passkey PRF test</h1>
<p class="sub">Phase 1 of the diary build. Checks that one passkey gives the same secret on every device.</p>
<section class="card">
<h2>1. Register (once, on Mac)</h2>
<button id="reg" type="button">Create passkey</button>
</section>
<section class="card">
<h2>2. Unlock (on each device)</h2>
<button id="get" type="button">Unlock with passkey</button>
<div id="fp" class="fp" aria-live="polite">—</div>
<p class="hint">Same fingerprint on iPhone and Mac = pass.</p>
</section>
<section class="card">
<h2>Log</h2>
<pre id="log"></pre>
</section>
</main>
<script>
const enc = new TextEncoder();
const logEl = document.getElementById('log');
const fpEl = document.getElementById('fp');
const log = (m) => { logEl.textContent += m + '\n'; };
const hex = (b) => [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join('');
const rand = (n) => crypto.getRandomValues(new Uint8Array(n));
const saltP = crypto.subtle.digest('SHA-256', enc.encode('diary-prf-test-v1'));

function setFp(text, bad) {
  fpEl.textContent = text;
  fpEl.className = bad ? 'fp bad' : 'fp';
}

async function show(prf, when) {
  const fp = hex(await crypto.subtle.digest('SHA-256', prf)).slice(0, 16).match(/.{4}/g).join(' ');
  setFp(fp, false);
  log('PRF fingerprint ' + when + ': ' + fp);
}

async function roundTrip(prf) {
  const ikm = await crypto.subtle.importKey('raw', prf, 'HKDF', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(32), info: enc.encode('diary-wrap-v1') },
    ikm, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  const iv = rand(12);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode('round trip ok'));
  const pt = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct));
  log('AES-256-GCM: ' + pt);
}

async function register() {
  try {
    const salt = await saltP;
    const cred = await navigator.credentials.create({ publicKey: {
      rp: { name: 'Diary', id: location.hostname },
      user: { id: rand(16), name: 'diary', displayName: 'Diary' },
      challenge: rand(32),
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { residentKey: 'required', userVerification: 'required' },
      extensions: { prf: { eval: { first: salt } } }
    }});
    const ext = cred.getClientExtensionResults();
    log('Registered. PRF enabled: ' + (ext.prf && 'enabled' in ext.prf ? ext.prf.enabled : 'not reported'));
    if (ext.prf && ext.prf.results && ext.prf.results.first) await show(ext.prf.results.first, 'at registration');
    else log('Now tap Unlock to read the PRF output.');
  } catch (e) {
    log('Register failed: ' + e.name + ': ' + e.message);
  }
}

async function unlock() {
  try {
    const salt = await saltP;
    const a = await navigator.credentials.get({ publicKey: {
      challenge: rand(32),
      rpId: location.hostname,
      userVerification: 'required',
      extensions: { prf: { eval: { first: salt } } }
    }});
    const ext = a.getClientExtensionResults();
    const r = ext.prf && ext.prf.results && ext.prf.results.first;
    if (!r) {
      setFp('No PRF output', true);
      log('FAIL: this browser or passkey gave no PRF output.');
      return;
    }
    await show(r, 'at unlock');
    await roundTrip(r);
  } catch (e) {
    log('Unlock failed: ' + e.name + ': ' + e.message);
  }
}

document.getElementById('reg').addEventListener('click', register);
document.getElementById('get').addEventListener('click', unlock);

(async () => {
  log('Origin: ' + location.origin);
  log('Browser: ' + navigator.userAgent);
  if (!window.PublicKeyCredential) {
    log('FAIL: WebAuthn not available here.');
    document.getElementById('reg').disabled = true;
    document.getElementById('get').disabled = true;
    return;
  }
  if (PublicKeyCredential.getClientCapabilities) {
    try {
      const caps = await PublicKeyCredential.getClientCapabilities();
      log('Reports PRF support: ' + (caps['extension:prf'] ?? 'not reported'));
    } catch (e) {
      log('Capability check failed: ' + e.message);
    }
  }
})();
</script>
</body>
</html>
